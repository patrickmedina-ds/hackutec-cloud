openapi: 3.0.3
info:
  title: Red TeleCorp · API de incidencias
  version: 1.0.0
  description: |
    Reportar una falla y consultar sus reportes es **público** (`POST /reportes`,
    `POST /reportes/consulta`): solo pueden hacerlo personas con un contrato registrado en la
    tabla `clientes`, identificadas por DNI o número de servicio.
    El resto usa Cognito User Pool (JWT en `Authorization`) y es para el personal:
    grupo `operadores`, acceso a todas las incidencias y a cambiar estados.
servers:
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
    variables:
      apiId: { default: xxxx }
      stage: { default: dev }
security:
  - cognito: []
paths:
  /reportes:
    post:
      summary: Reportar una falla (público, solo clientes con contrato)
      description: |
        Al menos uno de `documento` o `numeroServicio`. Si ambos vienen, deben ser del mismo contrato.
        Tras un 409, `numeroServicio` puede ser el valor enmascarado devuelto (`SRV-****0012`) junto al DNI.
        Zona, teléfono y correo se toman del contrato (cualquier otro campo del cuerpo se ignora) y se
        encola en SQS el mensaje de integraciones.md §1 con `usuarioId = cliente:<numeroServicio>`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportePublico' }
      responses:
        '202':
          description: Aceptado y encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidenciaId: { type: string, format: uuid }
                  estado: { type: string, enum: [REGISTRADA] }
                  zonaId: { type: string }
                  zonaNombre: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403':
          description: '`CONTRATO_SUSPENDIDO`'
          content:
            application/json:
              schema: { type: object, properties: { codigo: { type: string }, mensaje: { type: string } } }
        '404':
          description: '`CLIENTE_NO_ENCONTRADO` · "No encontramos un servicio con esos datos"'
          content:
            application/json:
              schema: { type: object, properties: { codigo: { type: string }, mensaje: { type: string } } }
        '409':
          description: '`VARIOS_SERVICIOS`: el DNI tiene más de un servicio y no se indicó cuál'
          content:
            application/json:
              schema:
                type: object
                properties:
                  codigo: { type: string, enum: [VARIOS_SERVICIOS] }
                  mensaje: { type: string }
                  servicios:
                    type: array
                    items:
                      type: object
                      properties:
                        numeroServicio: { type: string, example: 'SRV-****0012' }
                        zonaId: { type: string }
                        zonaNombre: { type: string }
  /reportes/consulta:
    post:
      summary: Consultar los reportes de un servicio (público)
      description: DNI y número de servicio deben ser del mismo contrato; si no, 404 genérico. La respuesta no lleva PII.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documento, numeroServicio]
              properties:
                documento: { type: string, pattern: '^[0-9]{8}$' }
                numeroServicio: { type: string, pattern: '^SRV-[0-9]{8}$' }
      responses:
        '200':
          description: Reportes del servicio, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: object
                properties:
                  servicio: { type: string, example: 'SRV-****0001' }
                  zonaId: { type: string }
                  zonaNombre: { type: string }
                  reportes:
                    type: array
                    items: { $ref: '#/components/schemas/ReporteConsultado' }
        '404': { $ref: '#/components/responses/Error' }
  /incidencias:
    post:
      summary: Registrar un reporte autenticado (compatibilidad)
      description: |
        Misma Lambda y validación de contrato que `POST /reportes` (antes era integración directa a SQS sin
        validar el contrato). El portal ya no lo usa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportePublico' }
      responses:
        '202':
          description: Igual que `POST /reportes`
        '400': { $ref: '#/components/responses/Error' }
    get:
      summary: Listar incidencias (operador; un usuario normal solo ve las suyas)
      parameters:
        - { name: zonaId, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/Estado' } }
        - { name: clase, in: query, schema: { type: string, enum: [INDIVIDUAL, COLECTIVA] } }
        - { name: desde, in: query, schema: { type: string, format: date-time } }
        - { name: limite, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Página de incidencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Incidencia' } }
                  cursor: { type: string, nullable: true }
  /incidencias/{incidenciaId}:
    get:
      summary: Detalle de una incidencia
      parameters: [ { $ref: '#/components/parameters/IncidenciaId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incidencia' }
        '404': { $ref: '#/components/responses/Error' }
  /incidencias/{incidenciaId}/historial:
    get:
      summary: Historial de estados
      parameters: [ { $ref: '#/components/parameters/IncidenciaId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transicion' }
  /incidencias/{incidenciaId}/estado:
    patch:
      summary: Cambiar estado (solo operadores)
      parameters: [ { $ref: '#/components/parameters/IncidenciaId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estadoNuevo]
              properties:
                estadoNuevo: { $ref: '#/components/schemas/Estado' }
                comentario: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incidencia' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /zonas:
    get:
      summary: Catálogo de zonas
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zona' }
  /antenas:
    get:
      summary: Antenas y su estado actual (operador)
      parameters:
        - { name: zonaId, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { type: string, enum: [NORMAL, CAIDA, SATURADA, INHABILITADA] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Antena' }
  /operadores:
    get:
      summary: Listar operadores (solo operadores)
      responses:
        '200':
          description: Miembros del grupo `operadores`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Operador' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Promover a operador a un usuario que ya creó su cuenta (solo operadores)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Usuario agregado al grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operador' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404':
          description: El usuario no existe ("El usuario debe crear su cuenta primero")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCuerpo' }
  /operadores/{email}:
    delete:
      summary: Quitar a un usuario del grupo operadores (solo operadores)
      parameters:
        - { name: email, in: path, required: true, schema: { type: string, format: email }, description: Correo codificado en URL }
      responses:
        '200':
          description: Usuario quitado del grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operador' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: No puedes quitarte a ti mismo o es el último operador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCuerpo' }
components:
  securitySchemes:
    cognito:
      type: apiKey
      in: header
      name: Authorization
      description: ID token de Cognito
  parameters:
    IncidenciaId:
      name: incidenciaId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              codigo: { type: string }
              mensaje: { type: string }
  schemas:
    Estado:
      type: string
      enum: [REGISTRADA, EN_REVISION, ATENDIDA, SOLUCIONADA, CERRADA]
    TipoProblema:
      type: string
      enum: [SIN_INTERNET, SIN_LLAMADAS, SIN_SMS, LENTITUD, INTERMITENCIA, OTRO]
    ReportePublico:
      type: object
      required: [tipo, descripcion]
      properties:
        documento: { type: string, pattern: '^[0-9]{8}$', description: DNI del titular }
        numeroServicio: { type: string, description: 'SRV-12345678 (o SRV-****1234 junto al DNI tras un 409)' }
        tipo: { $ref: '#/components/schemas/TipoProblema' }
        descripcion: { type: string, minLength: 1, maxLength: 1000 }
        fechaHoraEvento: { type: string, format: date-time, description: Por defecto, ahora }
    ReporteConsultado:
      type: object
      properties:
        incidenciaId: { type: string }
        estado: { $ref: '#/components/schemas/Estado' }
        zonaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoProblema' }
        descripcion: { type: string }
        fechaHoraEvento: { type: string, format: date-time }
        nivelPrioridad: { type: string }
        incidenteColectivoId: { type: string }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        resueltoEn: { type: string, format: date-time }
        historial:
          type: array
          items: { $ref: '#/components/schemas/Transicion' }
    Incidencia:
      type: object
      properties:
        incidenciaId: { type: string }
        clase: { type: string, enum: [INDIVIDUAL, COLECTIVA] }
        origen: { type: string, enum: [USUARIO, ANTENA, RECURRENCIA] }
        estado: { $ref: '#/components/schemas/Estado' }
        zonaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoProblema' }
        descripcion: { type: string }
        fechaHoraEvento: { type: string, format: date-time }
        tipoIA: { type: string, nullable: true }
        severidadIA: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA], nullable: true }
        resumenIA: { type: string, nullable: true }
        prioridad: { type: number, nullable: true }
        nivelPrioridad: { type: string, enum: [P1, P2, P3, P4], nullable: true }
        incidenteColectivoId: { type: string, nullable: true }
        usuariosAfectados: { type: integer, nullable: true }
        antenasAfectadas: { type: array, items: { type: string }, nullable: true }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        resueltoEn: { type: string, format: date-time, nullable: true }
    Transicion:
      type: object
      properties:
        estadoAnterior: { $ref: '#/components/schemas/Estado' }
        estadoNuevo: { $ref: '#/components/schemas/Estado' }
        actor: { type: string }
        comentario: { type: string, nullable: true }
        ts: { type: string, format: date-time }
    Zona:
      type: object
      properties:
        zonaId: { type: string }
        nombre: { type: string }
        tipoZona: { type: string, enum: [RESIDENCIAL, COMERCIAL, EDUCATIVA, INDUSTRIAL, MEDICA, CRITICA] }
        ciudad: { type: string }
        lat: { type: number }
        lon: { type: number }
    ErrorCuerpo:
      type: object
      properties:
        codigo: { type: string }
        mensaje: { type: string }
    Operador:
      type: object
      properties:
        email: { type: string, format: email }
        nombre: { type: string }
        creado: { type: string, format: date-time }
        estado: { type: string, description: 'Estado Cognito, p. ej. CONFIRMED' }
    Antena:
      type: object
      properties:
        antenaId: { type: string }
        zonaId: { type: string }
        estado: { type: string, enum: [NORMAL, CAIDA, SATURADA, INHABILITADA] }
        gbPorMinuto: { type: number }
        ultimaLectura: { type: string, format: date-time }
