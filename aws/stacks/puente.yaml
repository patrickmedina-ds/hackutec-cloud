AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Red TeleCorp - bloque B. Lambda puente-multinube que replica cada evento telecorp.*
  del bus a Event Grid (Azure) como CloudEvents 1.0, con federación
  de identidades sin llaves guardadas: Cognito Identity Pool (identidad de
  desarrollador) + credencial federada de Entra ID (ver docs/federacion.md).
  Learner Lab: todo usa LabRole, sin recursos IAM.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9-]+$"
  ComunLayerArn:
    Type: String
    Description: ARN de la capa telecorp_comun (la crea el stack raíz).
  RolLabArn:
    Type: String
    Description: ARN del rol LabRole (Learner Lab no permite crear roles IAM).

Resources:
  # ---------------------------------------------------------------------------
  # Cola de mensajes fallidos (eventos que no se pudieron replicar)
  # ---------------------------------------------------------------------------
  PuenteDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub telecorp-${Stage}-puente-dlq
      MessageRetentionPeriod: 1209600 # 14 días
      SqsManagedSseEnabled: true

  PuenteDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PuenteDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # EventBridge deja aquí los eventos que no logra entregar a la Lambda.
          - Sid: EventBridgeDLQ
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt PuenteDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ReglaPuente.Arn

  # ---------------------------------------------------------------------------
  # Cognito Identity Pool: emisor del JWT que Entra ID acepta (sin llaves).
  # Solo identidades de desarrollador; nada de identidades no autenticadas.
  # ---------------------------------------------------------------------------
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub telecorp_${Stage}_federacion_azure
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      DeveloperProviderName: telecorp.aws

  IdentityPoolIdParametro:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /telecorp/${Stage}/aws/identity-pool-id
      Type: String
      Value: !Ref IdentityPool
      Description: Audiencia de la credencial federada de Entra ID (puente e IA)

  PuenteLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/telecorp-${Stage}-puente-multinube
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Lambda
  # ---------------------------------------------------------------------------
  PuenteFuncion:
    Type: AWS::Serverless::Function
    DependsOn: PuenteLogs
    Properties:
      FunctionName: !Sub telecorp-${Stage}-puente-multinube
      Description: Replica eventos telecorp.* a Azure Event Grid (CloudEvents 1.0)
      CodeUri: ../src/puente_multinube/
      Handler: app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Role: !Ref RolLabArn
      Tracing: Active
      Layers:
        - !Ref ComunLayerArn
      Environment:
        Variables:
          STAGE: !Ref Stage
          BUS_EVENTOS: !Sub telecorp-${Stage}-eventos
          POWERTOOLS_SERVICE_NAME: puente-multinube
          DESTINOS: azure
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPool
          COGNITO_PROVEEDOR_DESARROLLADOR: telecorp.aws
      # La regla invoca la Lambda de forma asíncrona: si la función lanza error,
      # Lambda reintenta (2 veces) y luego deja el evento en la DLQ.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt PuenteDLQ.Arn

  # ---------------------------------------------------------------------------
  # Regla: todos los eventos con source "telecorp.*" del bus del stack raíz
  # ---------------------------------------------------------------------------
  ReglaPuente:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub telecorp-${Stage}-puente-todos
      Description: Todos los eventos telecorp.* hacia el puente multinube
      EventBusName: !Sub telecorp-${Stage}-eventos
      State: ENABLED
      EventPattern:
        source:
          - prefix: telecorp.
      Targets:
        - Id: puente-multinube
          Arn: !GetAtt PuenteFuncion.Arn
          # Reintentos de EventBridge si no logra entregar el evento a Lambda
          # (throttling, Lambda no disponible); luego, DLQ.
          RetryPolicy:
            MaximumRetryAttempts: 185
            MaximumEventAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt PuenteDLQ.Arn

  PermisoReglaPuente:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PuenteFuncion
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReglaPuente.Arn

  # ---------------------------------------------------------------------------
  # Alarmas
  # ---------------------------------------------------------------------------
  AlarmaPuenteDLQ:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub telecorp-${Stage}-puente-dlq-con-mensajes
      AlarmDescription: !Sub >-
        Hay eventos que no se replicaron a Azure tras agotar los reintentos.
        Revisar logs de telecorp-${Stage}-puente-multinube y redirigir la DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PuenteDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmaPuenteErrores:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub telecorp-${Stage}-puente-errores
      AlarmDescription: La Lambda puente-multinube está fallando (el destino no responde).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PuenteFuncion
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  PuenteFuncionArn:
    Value: !GetAtt PuenteFuncion.Arn
  IdentityPoolId:
    Description: Audiencia de la credencial federada (variable Terraform aws_cognito_identity_pool_id)
    Value: !Ref IdentityPool
  PuenteDLQUrl:
    Value: !Ref PuenteDLQ
  PuenteDLQArn:
    Value: !GetAtt PuenteDLQ.Arn
