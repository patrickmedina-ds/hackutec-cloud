AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Red TeleCorp - bloque G. Lambda clasificar-ia (Azure OpenAI gpt-4.1-mini con respaldo
  por reglas). Autenticación sin llaves: JWT de Cognito Identity canjeado en Entra ID.
  Learner Lab: usa LabRole, sin recursos IAM.

Parameters:
  Stage:
    Type: String
    Default: dev
  ComunLayerArn:
    Type: String
    Description: ARN de la capa telecorp_comun
  RolLabArn:
    Type: String
    Description: ARN del rol LabRole (Learner Lab no permite crear roles IAM).

Resources:
  ClasificarIa:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub telecorp-${Stage}-clasificar-ia
      Description: Clasifica incidencias, resume colectivos y redacta avisos con Azure OpenAI (respaldo por reglas)
      CodeUri: ../src/clasificar_ia/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      Role: !Ref RolLabArn
      Layers:
        - !Ref ComunLayerArn
      Environment:
        Variables:
          STAGE: !Ref Stage
          POWERTOOLS_SERVICE_NAME: !Sub telecorp-${Stage}-clasificar-ia
          COGNITO_PROVEEDOR_DESARROLLADOR: telecorp.aws
          # Configuración en SSM /telecorp/<stage>/azure/{tenant-id,client-id,openai-endpoint,
          # openai-deployment} y /telecorp/<stage>/aws/identity-pool-id (ver docs/federacion.md).

Outputs:
  ClasificarIaArn:
    Description: ARN de la Lambda clasificar-ia
    Value: !GetAtt ClasificarIa.Arn
